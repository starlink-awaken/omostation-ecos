      真源: .omo/state/system.yaml (health) / goals/current.yaml (phase).
      文档 (README/CLAUDE/CHANGELOG) 引用用相对指针, 不复制数字.
      复盘案例: health 曾在 system/CLAUDE/Kim 报告 3 处不同值 (77.5/22/67).
    dimension: X2
    rule: "volatile_value.document_count == 1 (SSOT) or uses_pointer == true"
    type: required
    severity: warn
    enforcement: pre-commit (SSOT 全文档扫描) + X2 抗熵
    introduced: '2026-06-24'
    value_tier: 1
    references:

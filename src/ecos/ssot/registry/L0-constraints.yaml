  # ── P60+ Agent 工程纪律 (CR-ENG-*) — 近期复盘规律物化 (2026-06-24) ──
  # 来源: mypy 清零/bug 链/kronos flaky/radar/omo_ingress 拆分等实战提炼.
  # 目的: 把"人肉经验"变"机器纪律", 未来 agent 自主感知→判断→治本行动.

  - id: CR-ENG-MYPY-TRUTH-01
    applies_to: [L0, L2]
    description: |
      mypy 验证必须用真相调法 MYPYPATH=src (禁裸 mypy src 假绿).
      假绿机制: 裸 mypy 无 MYPYPATH 时跨包 import 解析不出, 当 Any 静默通过, 退出 0.
      真相: MYPYPATH=src mypy src 暴露真实 errors. targeted 改动 (-> Any) 必须验证留存
      (防被批量还原). 复盘案例: kairon 曾虚标 "16/16 strict" 实为 1245 errors 假象.
    dimension: X1
    rule: "mypy_invocation.uses_mypypath == true or mypy_invocation == 'make typecheck-report'"
    type: required
    severity: error
    enforcement: CI gate (kairon-ci.yml MYPYPATH) + X1 审计
    introduced: '2026-06-24'
    value_tier: 1
    references:
      - "projects/kairon/mypy-baseline.yaml"
      - "scripts/mypy_report.py"
      - "memory: kairon-mypy-baseline-gate"
    violation: "用裸 mypy src 验证 (假绿); 或 targeted Any 改动未验证留存"

  - id: CR-ENG-SSOT-POINTER-01
    applies_to: [L0, L3, L4]

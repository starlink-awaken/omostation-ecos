constraints:
- applies_to:
  - L0
  - L1
  - L2
  - L3
  description: 所有跨层协议映射必须在 L0 Protocol Registry 中注册
  dimension: X1
  id: X1-C01
  rule: protocol.registered == true
  type: required
  violation: 'E-L0-001: 未注册协议映射'
- applies_to:
  - L1
  - L2
  - L3
  description: 跨层 MCP 调用必须经过 I0/Agora 路由
  dimension: X1
  id: X1-C02
  rule: layer.cross_call.route == 'I0/Agora'
  type: required
  violation: 'E-L0-002: 绕过 I0/Agora 的跨层直连'
- applies_to:
  - L1
  - L2
  - I0
  description: Agora Proxy 必须采用 lazy initialization 避免循环依赖锁死
  dimension: X1
  id: CR-MCP-LAZY-01
  rule: proxy.initialization == 'lazy'
  type: required
  violation: 'E-L0-011: 触发代理循环依赖 (Eager proxy initialization detected)'
- applies_to:
  - L0
  - I0
  description: BOS URI 路由表注册必须提供 domain 和 cross_references.realized_by 元数据 (仅 active 服务, deprecated 豁免)
  dimension: X1
  id: CS-10
  rule: bos_route.status == 'deprecated' or (bos_route.domain != null and bos_route.cross_references.realized_by != null)
  type: required
  violation: 'E-L0-012: BOS URI 元数据缺失'
- applies_to:
  - L2
  - L4
  description: 混合裁判测试用例必须使用 @pytest.mark.vibeops 隔离
  dimension: X1
  id: CR-VIBEOPS-01
  rule: test.is_vibeops implies 'vibeops' in test.markers
  type: required
  violation: 'E-L0-013: 混合裁判测试未被隔离，可能影响基础 CI 时效'
- applies_to:
  - L2
  - I0
  description: DeepEval/Ragas 等 LLM 裁判调用必须走 Agora LLM Gateway 进行计费与路由
  dimension: X1
  id: CR-VIBEOPS-02
  rule: vibeops.llm_calls.target == 'bos://capability/llm-gateway'
  type: required
  violation: 'E-L0-014: LLM 裁判绕过内部 Gateway，破坏安全合规与成本追踪'
- applies_to:
  - I0
  description: bos://capability/evaluator 及其子域工具，拒绝任何 role != evaluator 的请求
  dimension: X1
  id: CR-RBAC-01
  rule: request.target.startswith('bos://capability/evaluator') implies request.role == 'evaluator'
  type: required
  violation: 'E-L0-015: Generator 越权调用评估工具，破坏系统隔离性'
- applies_to:
  - I0
  - L2
  description: >
    Agora 注册新路由前必须通过 AdmissionPort 准入控制（五大部件义务）。
    实现由 I0 SPI / BOS 绑定（realized_by），L0 不点名具体实现类。
  dimension: X1
  id: CR-ADMISSION-01
  rule: bos_route.registration implies admission.evaluate(bos_route.metadata).status == 'admitted'
  realized_by: "agora.admission.AdmissionPort"
  type: required
  violation: 'E-L0-016: 未经 AdmissionPort 准入的黑户服务尝试接入 Agora'
- applies_to:
  - I0
  description: Agora register 是唯一写操作入口
  dimension: X1
  id: X1-C03
  rule: write.entry == 'agora.register'
  type: required
  violation: 'E-L0-003: 未经 Agora 的写操作'
- applies_to:
  - L2
  - L3
  - L4
  description: "`.omo` 顶层治理资产必须登记到 omo governance surfaces registry"
  dimension: X1
  id: CR-OMO-SURFACE-01
  rule: omo.top_level_asset in registry('.omo/_truth/registry/omo-governance-surfaces.yaml')
  type: required
  violation: "E-L0-017: `.omo` 顶层治理资产未登记"
- applies_to:
  - L2
  - L3
  - L4
  description: "`.omo` 只能被视为治理状态面，不得替代 `projects/omo` 治理内核"
  dimension: X1
  id: CR-OMO-SURFACE-02
  rule: omo.role == 'state_plane' and projects.omo.role == 'governance_kernel'
  type: required
  violation: "E-L0-018: `.omo` 与 `projects/omo` 边界混淆"
- applies_to:
  - L2
  - L3
  description: "`projects/c2g` 只能向 `.omo/tasks/planned/` 物化任务，不得直写 active/done"
  dimension: X1
  id: CR-C2G-INGRESS-01
  rule: c2g.write_scope subset_of ['.omo/tasks/planned/', '.omo/_truth/goals/current.yaml']
  type: required
  violation: 'E-L0-019: C2G 绕过治理入口直接改写执行态'
- applies_to:
  - L2
  - L3
  - L4
  description: "非 broker 不得直接以文件系统方式改写 `.omo/` 或 `spaces/`"
  dimension: X1
  id: CR-OMO-DIRECT-IO-01
  rule: non_broker.python_mutation(target in ['.omo/', 'spaces/']) == false
  type: required
  violation: 'E-L0-020: 非 broker 直接改写治理状态面'
- applies_to:
  - L0
  description: 协议版本必须声明——未版本化协议不可进入注册表
  dimension: X2
  id: X2-C01
  rule: protocol.version != null
  type: required
  violation: 'E-L0-004: 未版本化协议'
- applies_to:
  - L0
  description: 协议版本超过 2 个 MAJOR 版本应触发升级审查
  dimension: X2
  id: X2-C02
  rule: protocol.age_major_versions <= 2
  type: preferred
  violation: 'W-L0-001: 协议版本老化'
- applies_to:
  - L4
  description: CLAUDE.md 超过 60 天未更新应触发保鲜告警
  dimension: X2
  id: X2-C03
  rule: claude_md.age_days <= 60
  type: required
  violation: 'W-L0-002: CLAUDE.md 保鲜告警'
- applies_to:
  - L0
  description: 协议引入超过 half_life_days 后应触发老化审查
  dimension: X2
  id: X2-C04
  rule: protocol.age_days <= protocol.half_life_days
  type: preferred
  violation: 'W-L0-005: 协议超过半衰期'
- applies_to:
  - L2
  - L3
  - L4
  description: omo governance surfaces registry 超过 14 天未复核应触发保鲜告警
  dimension: X2
  id: X2-C05
  rule: registry('omo-governance-surfaces').age_days <= 14
  type: preferred
  violation: "W-L0-006: `.omo` 治理面注册表保鲜告警"
- applies_to:
  - L4
  description: 每个功能域应声明 value_tier
  dimension: X3
  id: X3-C01
  rule: domain.value_tier != null
  type: preferred
  violation: 'W-L0-003: 未声明 value_tier'
- applies_to:
  - L4
  description: value_tier=1 的域应有 cost_attribution
  dimension: X3
  id: X3-C02
  rule: domain.value_tier == 1 implies domain.cost_attribution != 'none'
  type: required
  violation: 'E-L0-004: 核心域无成本归因'
- applies_to:
  - L2
  - L3
  description: "`.omo` 状态面、`projects/omo` 内核、`projects/c2g` 入口应具备分层价值归因"
  dimension: X3
  id: X3-C03
  rule: governance_stack.value_attribution includes ['state_plane', 'kernel_plane', 'ingress_plane']
  type: required
  violation: 'E-L0-007: 治理三层价值归因缺失'
- applies_to:
  - L2
  - L3
  - L4
  description: "`.omo` INDEX、governance standard、registry、`projects/omo` 路径常量必须口径一致"
  dimension: X4
  id: X4-C01
  rule: omo.surface_classification == kernel.surface_classification == registry.surface_classification
  type: required
  violation: "E-L0-020: `.omo` 三层治理口径不一致"
- applies_to:
  - L2
  - L3
  description: "由 `projects/c2g` 物化的 planned task 应携带 governance_refs"
  dimension: X4
  id: X4-C02
  rule: task.imported_via startswith 'omo_bridge' implies len(task.governance_refs) > 0
  type: preferred
  violation: 'W-L0-008: C2G 产物缺少治理引用'
- applies_to:
  - L0
  - L2
  - L3
  description: 每个 COMP-WS-* 工作区项目组件必须声明 sfop_slot 与 dao_layer（脊面槽位 + 道法术器）
  dimension: X4
  id: CR-SFOP-01
  rule: component.id startswith 'COMP-WS-' implies (component.sfop_slot in [K,H,P,C,S,B,J,O,F] and component.dao_layer in [dao,fa,shu,qi])
  type: required
  violation: 'E-SFOP-001: 工作区组件未声明 SFOP 槽位或道法术器层级'
- applies_to:
  - L2
  description: 活跃 Project 组件中 sfop_slot=S（唯一 dispatcher）至多一个，且必须是 COMP-WS-omo
  dimension: X1
  id: CR-SFOP-02
  rule: count(component where subtype=='Project' and status=='active' and sfop_slot=='S') <= 1 and that id == 'COMP-WS-omo'
  type: required
  violation: 'E-SFOP-002: 出现第二 dispatcher 或 S 槽不属于 omo'
- applies_to:
  - L2
  description: P（感知）与 O（结果）槽允许空置；空槽不是缺口，补 holder 是可选成长
  dimension: X4
  id: CR-SFOP-04
  rule: vacant(sfop_slot in [P,O]) is allowed
  type: preferred
  violation: 'W-SFOP-004: 把允许空置的 P/O 槽误报为缺失'
- applies_to:
  - L3
  - L1
  description: H 槽不得直接 import B 槽项目。允许的 H→B 路径是经 F（agora），或 cockpit.adapters 作为 H 侧 B 端口（防腐层）。其它 H 文件新调用 fail-closed。
  dimension: X1
  id: CR-SFOP-05
  rule: import(caller.sfop_slot==H, callee.sfop_slot==B) implies false unless via F or caller path contains /adapters/
  type: required
  violation: 'E-SFOP-005: 人类面直连后端，未走织层 F 或 cockpit.adapters'
- applies_to:
  - L1
  - L3
  description: 声称活跃（status=active 或 claimed_active=true）的 cron 执行账本条目必须声明合法 sfop_slot；未声称活跃的存量缺槽仅 warn
  dimension: X1
  id: CR-SFOP-06
  rule: cron.job claimed_active implies cron.job.sfop_slot in [K,H,P,C,S,B,J,O,F]
  type: required
  violation: 'E-SFOP-006: 声称活跃的 cron 条目缺少合法槽位'
- applies_to:
  - L4
  - L1
  description: dao_layer=dao 的组件不得出现在 cron 执行账本
  dimension: X1
  id: CR-DFSQ-01
  rule: cron.command path_to_project dao_layer != dao
  type: required
  violation: 'E-DFSQ-001: 道层组件进入了执行账本'
- applies_to:
  - L0
  - L3
  description: dao_layer=qi 的项目树不得编写 L0 type=required 约束
  dimension: X4
  id: CR-DFSQ-02
  rule: qi project tree has no L0 required constraint documents
  type: required
  violation: 'E-DFSQ-002: 器层项目编写了 L0 必遵守约束'
- applies_to:
  - L3
  - L4
  description: 治理观察量（GaC 绿、scorecard、BET done、PR 数）不得作为北极星分子（已迁出 SFOP 族）
  dimension: X3
  id: CR-X3-NS-001
  rule: north_star.numerator subset_of human_verdict
  type: preferred
  violation: 'W-X3-001: 北极星分子混入治理自指量'
- applies_to:
  - L2
  - L4
  description: CI 平面 check 工具必须登记在 ci-surfaces.yaml SSOT (ADR-0379 E-1)
  dimension: X1
  id: CR-CI-01
  rule: ci.check.registered == true
  type: required
  violation: 'E-L0-021: workflow/sgf-policy 执行未登记的 CI 检查 (CR-CI-SURFACE-SSOT 违反)'


# M2: ConstraintL0
# M4 元模型闭环 — Phase 1 (ADR-0132 P1-S1)
# 继承 ConstraintMgmt,添加 L0-constraints 专用字段集
# 对齐实际 L0-constraints.yaml 数据格式 (v1 + trigger + opc 三种形态)

m2_type: ConstraintL0
version: 1.1.0
created: '2026-07-06T10:00:00'
updated: '2026-08-27'
ConstraintL0:
  m3_parent: ConstraintL0  # 继承 ConstraintL0 (m3.yaml ConstraintL0 类目)
  description: 织星 L0 协议约束 — 跨层协议契约。L0 registry/L0-constraints.yaml 的 M2 schema
  icon: 🔒

  # 沿用 ConstraintMgmt 7 态 + 加 L0 专属
  stateMachine:
    draft:
      description: 起草中
      transitions: [identified, archived]
    identified:
      description: 已识别待评估
      transitions: [scored, accepted, resolved, archived]
    scored:
      description: 已评分
      transitions: [scored_active, accepted, archived]
    scored_active:
      description: 已评分并生效
      transitions: [aging, deprecated, archived]
    aging:
      description: 超过半衰期,需复查
      transitions: [scored_active, deprecated, accepted, archived]
    deprecated:
      description: 已废弃,迁移中
      transitions: [archived]
    accepted:
      description: 接受不修复
      transitions: [archived]
    resolved:
      description: 已解决(被替代约束或重写)
      transitions: [archived]
    archived:
      description: 归档
      transitions: []

  # ──── 必填字段 (对齐 L0-constraints.yaml 实际数据) ────
  requiredProperties:
    id:
      type: string
      pattern: '^[A-Z][0-9]-C[0-9]{2,3}$|^CR-[A-Z0-9-]+-[0-9]{2}$|^CS-[0-9]{2}$'
      description: L0 约束 ID (X1-C0[0-9]+ / CR-XXX-NN / CS-NN)
    description:
      type: string
      minLength: 5
      description: 约束描述
    applies_to:
      type: list
      items:
        type: enum
        values: [L0, L1, L2, L3, L4, I0]
        minItems: 1
      description: 适用层 (L0-L4 物理层, I0 集成层)
    dimension:
      type: enum
      values: [X1, X2, X3, X4]
      description: 治理维度
    type:
      type: enum
      values: [required, preferred, advisory]
      description: 约束类型 (required=强制, preferred=推荐, advisory=建议)
    rule:
      type: string
      minLength: 3
      description: 谓词表达式 (DSL 约束规则)
    violation:
      type: string
      pattern: '^[EW]-(L0|L[0-4])-[A-Z0-9-]+: .+$'
      description: 违规代码+默认消息 (E=Error, W=Warning)
    relation_constraints:
      type: map
      properties:
        affects:
          type: list
          items: { type: ref }
        depends_on:
          type: list
          items: { type: ref }
        conflicts_with:
          type: list
          items: { type: ref }
      description: 与其他约束的关系

  # ──── 可选字段 (对齐 trigger/opc 约束扩展) ────
  optionalProperties:
    name:
      type: string
      description: 约束显示名称 (trigger/opc 约束使用)
    severity:
      type: enum
      values: [error, warning, critical]
      description: 严重度 (用于 trigger/opc 约束, 与 type 互补)
    confidence:
      type: enum
      values: [fact, inference, hypothesis, estimated]
      default: fact
      description: 元模型的置信度 (Phase 2 桥接 meta_model.py.Confidence)
    references:
      type: list
      items: { type: string }
      description: 引用路径 (文档/脚本/反馈)
    rationale:
      type: string
      description: 约束存在的 rationale (架构意图)
    half_life_days:
      type: integer
      default: 365
      min: 1
      description: 价值半衰期 (天),默认 1 年
    introduced:
      type: date
      description: 引入日期 (OPC 约束使用)
    value_tier:
      type: integer
      min: 1
      max: 3
      description: 价值层级 (1=核心, 2=重要, 3=一般)
    gac_ref:
      type: string
      pattern: '^CR-[A-Z0-9-]+$'
      description: 关联的 GaC 规则 ID (governance-checks.yaml::rules)

  # ──── 校验规则 ────
  validationRules:
    - rule: type == 'required' implies violation matches '^E-.+$'
      level: error
      message: required 约束的 violation 必须以 E- 开头
    - rule: type == 'preferred' implies violation matches '^[EW]-.+$'
      level: warning
      message: preferred 约束的 violation 建议以 W- 开头
    - rule: severity == 'error' implies type == 'required'
      level: error
      message: severity=error 的约束必须是 required 类型

  # ──── 关系约束 ────
  relationConstraints:
    can_be_source_of:
      - Constrains
      - ConflictsWith
    can_be_target_of:
      - Constrains
      - DependsOn
      - Supersedes
      - ConflictsWith

  # ──── ADR / 治理锚 ────
  adr_refs:
    - ADR-0132 (L0/M0/MOF 统一元模型)
    - ADR-0129 (state projection plane, gitignored 派生面)

  examples:
    - id: X1-C01
      description: 所有跨层协议映射必须在 L0 Protocol Registry 中注册
      applies_to: [L0, L1, L2, L3]
      dimension: X1
      type: required
      rule: 'protocol.registered == true'
      violation: 'E-L0-001: 未注册协议映射'
      confidence: fact
      state: scored_active
    - id: CR-MCP-LAZY-01
      description: Agora Proxy 必须采用 lazy initialization 避免循环依赖锁死
      applies_to: [L0, L1, L2, I0]
      dimension: X1
      type: required
      rule: "proxy.initialization == 'lazy'"
      violation: 'E-L0-011: 触发代理循环依赖 (Eager proxy initialization detected)'
      confidence: fact
      half_life_days: 730
      state: scored_active
    - id: CR-TRIGGER-01
      name: "Trigger 注册约束"
      description: "所有异步触发机制必须在 L0 Trigger Registry 注册为 M1 节点"
      rule: "for each Trigger in system: exists M1 node with type='trigger'"
      type: required
      severity: error
      violation: "未注册的触发机制无法被系统感知和治理"

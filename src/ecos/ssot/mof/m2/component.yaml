# M2: Component
# Split from M2-元模型.yaml

m2_type: Component
version: 1.0.0
created: '2026-06-06T08:00:00'
Component:
  m3_parent: StructuralElement.Component
  description: 可部署/可运行的功能单元——服务、库、项目。回答'系统由哪些部件组成'。
  icon: 🧱
  stateMachine:
    active:
      description: 运行中
      transitions:
      - degraded
      - stopped
      - archived
    degraded:
      description: 降级运行
      transitions:
      - active
      - stopped
    stopped:
      description: 已停止
      transitions:
      - active
      - archived
    archived:
      description: 已归档
      transitions: []
  requiredProperties:
    layer:
      type: string
      description: 所属架构层 (L0-L4/I0/P0/X1-X4)
    runtime:
      type: enum
      values:
      - active
      - idle
      - stopped
      - unknown
      description: 运行时状态
  optionalProperties:
    protocol:
      type: ref
      description: 使用的协议
    port:
      type: integer
      description: 监听端口
    has_tests:
      type: boolean
      description: 是否有测试
    sfop_slot:
      type: enum
      values:
      - K
      - H
      - P
      - C
      - S
      - B
      - J
      - O
      - F
      description: SFOP/v1 运行时槽位（宪法/人类面/感知/认知/脊柱/后端/投影/结果/织层）
    dao_layer:
      type: enum
      values:
      - dao
      - fa
      - shu
      - qi
      description: 道法术器层级（DFSQ/v1；嵌套 MOF，不是新根类型）
  validationRules:
  - rule: layer != null
    level: error
    message: 组件必须声明所属层
  - rule: subtype == 'Project' and status == 'active' implies sfop_slot != null
    level: error
    message: 活跃工作区项目必须声明 SFOP 槽位（硬检查 check-sfop-slots.py CR-SFOP-01）
  - rule: subtype == 'Project' and status == 'active' implies dao_layer != null
    level: error
    message: 活跃工作区项目必须声明道法术器层级（硬检查 check-sfop-slots.py CR-SFOP-01）
  examples:
  - id: COMP-WS-agora
    name: Agora Service Mesh
    description: I0 集成织物 — MCP路由·动态代理
  - id: COMP-WS-cockpit
    name: Cockpit Entry Bridge
    description: L3 入口桥接 — 多Agent接入
  relations:
    depends_on:
      type: ref
      target: Component
      description: 依赖的组件
    provides:
      type: ref
      target: Service
      description: 提供的服务
    uses:
      type: ref
      target: MCPTool
      description: 使用的工具
    parent:
      type: ref
      target: Component
      description: 父组件
    subcomponents:
      type: list
      target: Component
      description: 子组件列表

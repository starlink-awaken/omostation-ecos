id: GAC-RULE-CR-X2-PITFALLS-INDEX-INTEGRITY
type: GacRule
name: AGENTS.md §7 索引条首短语字面可命中
description: AGENTS.md §7 把「条首短语」当寻址键用（明确禁止按序号引用），所以每条登记的 「…」 必须能在 docs/pitfalls.md
  里逐字 rg 到。实测 main=aafc91bd6 上 §7 登记 43 条、字面可命中 29、不可命中 14（33%），且此前没有任何治理脚本读 docs/pitfalls.md
  —— 失配是长期无测的稳态而非回归。后果不是美观：按索引去 rg 的人/agent 拿到 0 命中，会据此下「这条 pitfall 不存在」的结论，与 §7 的「声明
  ≠ 执行」同族（登记面存在、检索面缺席）。判据只查索引→正文一个方向、只认字面子串，不做模糊匹配（放宽就不再检验「能不能 rg 到」）。反向不查：正文 123
  条、§7 自陈只列高频咬人条目，反向是把索引当全量目录的口径错误。仪器自证：文件缺失或 §7 解析不出表行短语时报 error 并判红，不交空转的绿。以 enforcement=advisory
  上线，阻断由脚本自己的 ENFORCE_AFTER=2026-12-12 决定 (BET-Y2Q4-T10-346 principal 授权全面推进, 沿用 ADR-0457
  三段式的限期自动转红)；升 mandatory 的前置条件是连续 5 个触碰 §7 的 PR 在本 gate 上零告警。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecos"
version = "0.8.0"
description = "eCOS — 认知层：SSB 签名链、涌现度量、认知监控"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "fastmcp>=3.4.2",
]

[project.optional-dependencies]
dashboard = []

[project.scripts]
ecos-dashboard = "ecos.cli.dashboard:main"
ecos-scheduler = "ecos.cli.scheduler:main"
ecos-watchdog = "ecos.cli.watchdog:main"
ecos-constraint = "ecos.cli.constraint:main"
ecos-mcp = "ecos.mcp_server:main"
mof-contract-lint = "ecos.ssot.tools.mof_contract_lint:main"
mof-contract-agent = "ecos.ssot.agents.mof_contract_agent:main"
ecos-partition-lint = "ecos.ssot.tools.partition_import_lint:main"

[project.entry-points."ecos.agents"]
mof-contract-agent = "ecos.ssot.agents.mof_contract_agent:main"

[tool.ruff]
target-version = "py313"
line-length = 120
# generated/ 是生成器产物(mof_control_models.py 等), 以生成器输出为准,
# 手工 format 会让 test_generated_control_dir_is_clean 判"不干净"
exclude = ["src/ecos/ssot/mof/generated"]

[tool.ruff.lint]
# 2026-08-23: 显式钉死规则集。ruff 0.16 起默认集大幅扩容(BLE/DTZ/UP/SIM 等
# 转正进默认), 存量代码在同一份配置下从 0 错误爆出 1113 个"伪债"挡死
# pre-push 门禁。工具升级不应隐式收紧仓库标准 —— 规则集必须是一份显式
# 契约; 要扩规则走 PR 逐条评审, 不吃默认集漂移的暗亏。
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E402", "F403"]
per-file-ignores = {"tests/*" = ["N806"]}

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.hatch.build.targets.wheel]
packages = ["src/ecos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecos"
version = "0.8.0"
description = "eCOS — 认知层：SSB 签名链、涌现度量、认知监控"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "fastmcp>=3.4.2",
]

[project.optional-dependencies]
dashboard = []

[project.scripts]
ecos-dashboard = "ecos.cli.dashboard:main"
ecos-scheduler = "ecos.cli.scheduler:main"
ecos-watchdog = "ecos.cli.watchdog:main"
ecos-constraint = "ecos.cli.constraint:main"
ecos-mcp = "ecos.mcp_server:main"
mof-contract-lint = "ecos.ssot.tools.mof_contract_lint:main"
mof-contract-agent = "ecos.ssot.agents.mof_contract_agent:main"
ecos-partition-lint = "ecos.ssot.tools.partition_import_lint:main"

[project.entry-points."ecos.agents"]
mof-contract-agent = "ecos.ssot.agents.mof_contract_agent:main"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "E402", "F403"]
per-file-ignores = {"tests/*" = ["N806"]}

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.hatch.build.targets.wheel]
packages = ["src/ecos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

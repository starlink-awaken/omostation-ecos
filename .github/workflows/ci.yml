name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Lint
        # 门禁子集与主仓 pre-commit 对齐 (E4,E7,E9,F); 全量 1068 条为建议性规则不设门禁
        run: uv run ruff check src/ --select E4,E7,E9,F --ignore E402,F403

      - name: Test
        run: uv run pytest tests/ -q

      - name: Integration Test
        run: uv run pytest tests/test_l0/test_integration.py -v

      - name: Distributed Test
        run: uv run pytest tests/test_l0/test_distributed.py -v
